name: 'Universal PR Review Bot'
description: 'Automated PR code review bot with static security/style analyzers + Google Gemini AI.'
author: 'PR_Bot'

branding:
  icon: 'git-pull-request'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub Token for authentication and PR commenting.'
    required: true
    default: ${{ github.token }}
  gemini-api-key:
    description: 'Google Gemini API key for AI-powered code reviews (optional).'
    required: false
    default: ''
  gemini-model:
    description: 'Gemini model to use (leave empty to use default from GeminiOptions).'
    required: false
    default: ''
  dotnet-version:
    description: '.NET SDK version to install on runner.'
    required: false
    default: '10.0.x'
  fail-on-errors:
    description: 'Fail the GitHub workflow check if critical errors are detected.'
    required: true
    default: 'true'
  review-event-mode:
    description: "GitHub review submission mode: 'dynamic' (default), 'strict', or 'comment-only'."
    required: false
    default: 'dynamic'

runs:
  using: 'composite'
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Run PR Bot
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_DESCRIPTION: ${{ github.event.pull_request.body }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        PR_BASE: ${{ github.event.pull_request.base.ref }}
        PR_HEAD: ${{ github.event.pull_request.head.ref }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        GEMINI_MODEL: ${{ inputs.gemini-model }}
        FAIL_ON_ERRORS: ${{ inputs.fail-on-errors }}
        REVIEW_EVENT_MODE: ${{ inputs.review-event-mode }}
      run: |
        dotnet run --configuration Release --project "${{ github.action_path }}/src/PR_Bot.Action/PR_Bot.Action.csproj"
